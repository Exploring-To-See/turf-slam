<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Turf Slam Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/shared/ts-stage.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<section class="login" id="login-view" hidden>
  <div class="login-card">
    <img src="/assets/turf-slam-logo-1200-noball.webp" width="1200" height="452" alt="The Turf Slam">
    <h1>Admin console</h1>
    <p>Organisers only. Enter the password to run registrations and the auction.</p>
    <form id="login-form" autocomplete="on">
      <div><label class="label" for="p">Password</label><input class="input" id="p" name="password" type="password" autocomplete="current-password" required></div>
      <p class="form-err" id="login-err" role="alert" hidden></p>
      <button class="btn" type="submit" id="login-btn">Sign in</button>
    </form>
  </div>
</section>

<div class="app" id="app" hidden>
  <aside class="side">
    <a class="side-brand" href="#/overview" aria-label="Overview"><img src="/assets/turf-slam-logo-1200-noball.webp" width="1200" height="452" alt="The Turf Slam"><span>Admin</span></a>
    <nav class="nav" id="nav" aria-label="Sections">
      <h4>Tournament</h4>
      <a href="#/overview" data-r="overview">Overview</a>
      <a href="#/registrations" data-r="registrations">Registrations <span class="pill" id="pill-regs"></span></a>
      <h4>Auction</h4>
      <a href="#/live" data-r="live">Live control <span class="pill" id="pill-live"></span></a>
      <a href="#/players" data-r="players">Players <span class="pill" id="pill-players"></span></a>
      <a href="#/teams" data-r="teams">Teams</a>
      <a href="#/rules" data-r="rules">Rules and setup</a>
    </nav>
    <div class="side-foot">
      <span class="live" id="live"><i class="dot"></i><span id="live-t">Connecting</span></span>
      <a class="mini" href="/auction" target="_blank" rel="noopener">Open public auction</a>
      <span class="who" id="who"></span>
      <button class="mini" id="logout" type="button">Sign out</button>
    </div>
  </aside>
  <main class="main" id="view" tabindex="-1"></main>
</div>

<dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>
<dialog id="img-dlg" class="lightbox">
  <div class="dlg"><h2 id="img-h">Image</h2><img id="img-el" alt=""><div class="dlg-acts"><button class="mini" type="button" id="img-close">Close</button></div></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="/shared/roster.js"></script>
<script src="/shared/ts-stage.js"></script>
<script src="/shared/bally.js"></script>
<script src="/admin/app.js"></script>
</body>
</html>
